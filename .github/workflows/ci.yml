name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git lfs install
      - run: python -m unittest discover -s tests -v

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Autodesk's adsk type stubs (vendor/FusionAPIReference)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes pyright@latest

  # Publishing a release on GitHub (tag vX.Y.Z) builds the add-in with that version
  # and attaches FusionGit-X.Y.Z.zip to the release.
  release-asset:
    if: github.event_name == 'release'
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zip
        run: python tools/package.py --version "${GITHUB_REF_NAME#v}"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/FusionGit-*.zip --clobber
